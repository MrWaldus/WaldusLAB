<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaldusLab – Editor de Fotos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: 'Space Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            border: 2px solid #fff;
            padding: 15px 30px;
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }
        .header h1 {
            font-size: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .header a {
            color: #fff;
            font-size: 0.8rem;
            margin-top: 8px;
            display: inline-block;
        }
        .editor-container {
            border: 2px solid #fff;
            padding: 20px;
            width: 100%;
            max-width: 800px;
        }
        .upload-area {
            border: 2px dashed #444;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover { border-color: #fff; }
        canvas {
            display: block;
            max-width: 100%;
            margin: 15px 0;
            border: 1px solid #333;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
        }
        .control-group label {
            font-size: 0.75rem;
            margin-bottom: 3px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            background: #000;
            border: 1px solid #fff;
            height: 6px;
            border-radius: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border: 2px solid #000;
            cursor: pointer;
        }
        .btn-brutal {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 12px;
            font-family: inherit;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .btn-brutal:hover { background: #fff; color: #000; }
        .download-link {
            display: block;
            margin-top: 10px;
            color: #fff;
            text-align: center;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Editor de Fotos</h1>
        <a href="index.html">← Volver a WaldusLab</a>
    </div>
    <div class="editor-container">
        <div class="upload-area" id="uploadArea">
            📁 Arrastra una imagen o haz clic para cargar
            <input type="file" id="fileInput" accept="image/*" hidden>
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
        <div id="controls" style="display:none;">
            <div class="controls">
                <div class="control-group">
                    <label>Brillo</label>
                    <input type="range" id="brightness" min="-100" max="100" value="0">
                </div>
                <div class="control-group">
                    <label>Contraste</label>
                    <input type="range" id="contrast" min="-100" max="100" value="0">
                </div>
                <div class="control-group">
                    <label>Saturación</label>
                    <input type="range" id="saturation" min="-100" max="100" value="0">
                </div>
                <div class="control-group">
                    <label>Blanco y negro</label>
                    <input type="range" id="grayscale" min="0" max="100" value="0">
                </div>
            </div>
            <button class="btn-brutal" id="resetBtn">↺ Restablecer</button>
            <a id="downloadLink" class="download-link" href="#" download="walduslab_edit.jpg">⬇️ Descargar imagen</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const brightness = document.getElementById('brightness');
        const contrast = document.getElementById('contrast');
        const saturation = document.getElementById('saturation');
        const grayscale = document.getElementById('grayscale');
        const resetBtn = document.getElementById('resetBtn');
        const downloadLink = document.getElementById('downloadLink');

        let originalImage = null;

        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', loadImage);
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#fff'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#444'; });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#444';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                loadImage();
            }
        });

        function loadImage() {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    originalImage = img;
                    applyFilters();
                    canvas.style.display = 'block';
                    controls.style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function applyFilters() {
            if (!originalImage) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const b = parseInt(brightness.value);
            const c = parseInt(contrast.value);
            const s = parseInt(saturation.value);
            const g = parseInt(grayscale.value);

            ctx.filter = `brightness(${100 + b}%) contrast(${100 + c}%) saturate(${100 + s}%) grayscale(${g}%)`;
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            downloadLink.href = canvas.toDataURL('image/jpeg', 0.9);
        }

        [brightness, contrast, saturation, grayscale].forEach(input => input.addEventListener('input', applyFilters));

        resetBtn.addEventListener('click', () => {
            brightness.value = 0;
            contrast.value = 0;
            saturation.value = 0;
            grayscale.value = 0;
            applyFilters();
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
