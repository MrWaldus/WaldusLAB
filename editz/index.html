            function applyPixelSortEffect(octx, w, h) {
                // threshold : pixels with sort-value >= threshold open a sort span.
                //             Lower value = more pixels qualify = longer, dramatic streaks.
                // amount    : 1-100. Controls which lines are processed (line density).
                //             100 = every line; 50 = every other line; 10 = every 10th.
                // blendAmount: 0-100. How fully the sorted result replaces the original.
                //             100 = full glitch; 0 = invisible.
                // randomness: 0-100. How frequently a span is reversed (deterministic).
                // basis     : which channel drives the sort key.
                // direction : horizontal or vertical.
                const ps      = state.pixelSort;
                const imgData = octx.getImageData(0, 0, w, h);
                const data    = imgData.data;
                const src     = new Uint8ClampedArray(data);
                const blend   = ps.blendAmount / 100;
                const thresh  = ps.threshold;

                // lineStep: 1=every line, 2=every other, etc.
                const lineStep  = Math.max(1, Math.ceil(100 / Math.max(1, ps.amount)));
                // revPeriod: 0=never reverse; N=reverse every N-th processed line
                const revPeriod = (ps.randomness > 0)
                    ? Math.max(1, Math.floor(100 / ps.randomness))
                    : 0;

                // Fast luminance approximation using integer math
                function getVal(b) {
                    switch (ps.basis) {
                        case 'red':   return src[b];
                        case 'green': return src[b + 1];
                        case 'blue':  return src[b + 2];
                        default:      return (src[b] * 77 + src[b + 1] * 150 + src[b + 2] * 29) >> 8;
                    }
                }

                // Write sorted pixels back, blended with the original.
                // baseIdx = byte offset of the first pixel in the span.
                // stride  = bytes between consecutive pixels (4=horizontal, w*4=vertical).
                function writeSpan(px, baseIdx, stride) {
                    for (var i = 0, n = px.length; i < n; i++) {
                        var t = baseIdx + i * stride;
                        // Interpolation: Uint8ClampedArray auto-clamps results to 0-255
                        data[t]     = src[t]     + Math.round((px[i].r - src[t])     * blend);
                        data[t + 1] = src[t + 1] + Math.round((px[i].g - src[t + 1]) * blend);
                        data[t + 2] = src[t + 2] + Math.round((px[i].k - src[t + 2]) * blend);
                    }
                }

                // Collect, sort, and write one contiguous span of pixels.
                function processSpan(spanStart, spanEnd, lineBase, stride, lineCount) {
                    var len = spanEnd - spanStart;
                    if (len < 2) return;
                    var px = [];
                    for (var i = spanStart; i < spanEnd; i++) {
                        var b = lineBase + i * stride;
                        px.push({ r: src[b], g: src[b + 1], k: src[b + 2], v: getVal(b) });
                    }
                    px.sort(function(a, c) { return a.v - c.v; });
                    if (revPeriod > 0 && lineCount % revPeriod === 0) px.reverse();
                    writeSpan(px, lineBase + spanStart * stride, stride);
                }

                var processed = 0;
                if (ps.direction === 'horizontal') {
                    for (var y = 0; y < h; y += lineStep, processed++) {
                        var rowBase = y * w * 4;
                        var spanStart = -1;
                        for (var x = 0; x <= w; x++) {
                            var v = (x < w) ? getVal(rowBase + x * 4) : -1;
                            if (v >= thresh && spanStart === -1) {
                                spanStart = x;
                            } else if (v < thresh && spanStart !== -1) {
                                processSpan(spanStart, x, rowBase, 4, processed);
                                spanStart = -1;
                            }
                        }
                    }
                } else {
                    for (var x = 0; x < w; x += lineStep, processed++) {
                        var colBase = x * 4;
                        var spanStart = -1;
                        for (var y = 0; y <= h; y++) {
                            var v = (y < h) ? getVal(y * w * 4 + colBase) : -1;
                            if (v >= thresh && spanStart === -1) {
                                spanStart = y;
                            } else if (v < thresh && spanStart !== -1) {
                                processSpan(spanStart, y, colBase, w * 4, processed);
                                spanStart = -1;
                            }
                        }
                    }
                }

                octx.putImageData(imgData, 0, 0);
            }

            function applyVHSEffect(octx, w, h) {
                const v = state.vhs;
                const imgData = octx.getImageData(0,0,w,h);
                const d = imgData.data;
                const src = new Uint8ClampedArray(d);
                if (v.rgbShift>0) { for (let y=0; y<h; y++) for (let x=0; x<w; x++) { const idx=(y*w+x)*4; const rx=clamp(x+Math.round(v.rgbShift),0,w-1), bx=clamp(x-Math.round(v.rgbShift*0.7),0,w-1); d[idx]=src[(y*w+rx)*4]; d[idx+2]=src[(y*w+bx)*4+2]; } }
                if (v.scanlines) { for (let y=0; y<h; y+=2) for (let x=0; x<w; x++) { const idx=(y*w+x)*4; d[idx]=clamp(d[idx]*0.75,0,255); d[idx+1]=clamp(d[idx+1]*0.75,0,255); d[idx+2]=clamp(d[idx+2]*0.75,0,255); } }
                if (v.noise>0) { const n=v.noise/100*60; for (let i=0; i<d.length; i+=4) { const rn=(Math.random()-0.5)*n*2; d[i]=clamp(d[i]+rn,0,255); d[i+1]=clamp(d[i+1]+rn,0,255); d[i+2]=clamp(d[i+2]+rn,0,255); } }
                if (v.wobble>0) { const wb=new Uint8ClampedArray(d); for (let y=0; y<h; y++) { const sh=Math.round(Math.sin(y*0.1)*v.wobble); for (let x=0; x<w; x++) { const sx=clamp(x+sh,0,w-1); const idx=(y*w+x)*4, sidx=(y*w+sx)*4; d[idx]=wb[sidx]; d[idx+1]=wb[sidx+1]; d[idx+2]=wb[sidx+2]; } } }
                if (v.saturationDecay>0) { const dec=1-v.saturationDecay/100; for (let i=0; i<d.length; i+=4) { const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]; d[i]=clamp(gray+(d[i]-gray)*dec,0,255); d[i+1]=clamp(gray+(d[i+1]-gray)*dec,0,255); d[i+2]=clamp(gray+(d[i+2]-gray)*dec,0,255); } }
                if (v.trackingLines>0) { const nLines=Math.round(v.trackingLines/100*h*0.1); for (let i=0; i<nLines; i++) { const ly=Math.floor(Math.random()*h); const lh=Math.ceil(Math.random()*4)+1; for (let yy=ly; yy<Math.min(ly+lh,h); yy++) for (let x=0; x<w; x++) { const idx=(yy*w+x)*4; d[idx]=clamp(d[idx]+30,0,255); d[idx+1]=clamp(d[idx+1]+30,0,255); d[idx+2]=clamp(d[idx+2]+30,0,255); } } }
                if (v.colourBleed>0) { const bleed=v.colourBleed/100*8; const bd=new Uint8ClampedArray(d); for (let y=0; y<h; y++) for (let x=0; x<w; x++) { const idx=(y*w+x)*4; const bx=clamp(x+Math.round(bleed),0,w-1), rx=clamp(x-Math.round(bleed*0.6),0,w-1); d[idx]=bd[(y*w+rx)*4]; d[idx+2]=bd[(y*w+bx)*4+2]; } }
                if (v.blur>0) { const r=Math.round(v.blur/5); if (r>=1) { const bd=new Uint8ClampedArray(d); for (let y=r; y<h-r; y++) for (let x=r; x<w-r; x++) { const idx=(y*w+x)*4; let sr=0,sg=0,sb=0,c=0; for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++) { const nidx=((y+dy)*w+(x+dx))*4; sr+=bd[nidx]; sg+=bd[nidx+1]; sb+=bd[nidx+2]; c++; } d[idx]=sr/c; d[idx+1]=sg/c; d[idx+2]=sb/c; } } }
                octx.putImageData(imgData,0,0);
            }

            function applyPhotocopierEffect(octx, w, h) {
                const pc = state.photocopier;
                const imgData = octx.getImageData(0,0,w,h);
                const d = imgData.data;
                const src = new Uint8ClampedArray(d);
                const th = pc.bwThreshold, td = pc.tonerDensity/100, cc = pc.contrastCrush/100, bh = pc.blownHighlights/100, ds = pc.dirtyShadows/100, pg = pc.paperGrey;
                for (let i=0; i<d.length; i+=4) {
                    let lum = 0.299*src[i] + 0.587*src[i+1] + 0.114*src[i+2];
                    lum = clamp((lum-128)*(1+cc*2)+128,0,255);
                    let val = lum > (th - td*30) ? 255 : pg;
                    if (lum>240) val = clamp(val + bh*30, 0,255);
                    if (lum<40) val = clamp(val + ds*20, 0,255);
                    d[i]=d[i+1]=d[i+2]=val;
                }
                if (pc.tonerSpeckles>0) { const cnt=Math.round(pc.tonerSpeckles/100*w*h*0.05); for (let i=0; i<cnt; i++) { const sx=Math.floor(Math.random()*w), sy=Math.floor(Math.random()*h); const idx=(sy*w+sx)*4; const v=Math.random()>0.5?0:255; for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) { const nx=sx+dx, ny=sy+dy; if (nx>=0&&nx<w&&ny>=0&&ny<h) { const nidx=(ny*w+nx)*4; d[nidx]=d[nidx+1]=d[nidx+2]=v; } } } }
                if (pc.dust>0) { const cnt=Math.round(pc.dust/100*w*h*0.02); for (let i=0; i<cnt; i++) { const sx=Math.floor(Math.random()*w), sy=Math.floor(Math.random()*h); const idx=(sy*w+sx)*4; const dv=200+Math.random()*55; d[idx]=d[idx+1]=d[idx+2]=dv; } }
                if (pc.verticalStreaks>0) { const cnt=Math.round(pc.verticalStreaks/100*w*0.05); for (let i=0; i<cnt; i++) { const sx=Math.floor(Math.random()*w); const sw=Math.ceil(Math.random()*3); for (let y=0; y<h; y++) for (let dx=0; dx<sw; dx++) { const nx=sx+dx; if (nx<w) { const idx=(y*w+nx)*4; d[idx]=clamp(d[idx]*0.8+40,0,255); d[idx+1]=clamp(d[idx+1]*0.8+40,0,255); d[idx+2]=clamp(d[idx+2]*0.8+40,0,255); } } } }
                if (pc.copyMisalignment>0) { const sx=Math.round(pc.copyMisalignment/10*3), sy=Math.round(pc.copyMisalignment/10*2); const cp=new Uint8ClampedArray(d); for (let y=0; y<h; y++) for (let x=0; x<w; x++) { const idx=(y*w+x)*4, six=clamp(x-sx,0,w-1), siy=clamp(y-sy,0,h-1); const sidx=(siy*w+six)*4; d[idx]=clamp(d[idx]*0.5+cp[sidx]*0.5,0,255); d[idx+1]=clamp(d[idx+1]*0.5+cp[sidx+1]*0.5,0,255); d[idx+2]=clamp(d[idx+2]*0.5+cp[sidx+2]*0.5,0,255); } }
                if (pc.doubleCopyGhost>0) { const sh=Math.round(pc.doubleCopyGhost/10*8), op=pc.doubleCopyGhost/100; const cp=new Uint8ClampedArray(d); for (let y=0; y<h; y++) for (let x=0; x<w; x++) { const gx=clamp(x+sh,0,w-1), gy=clamp(y+sh,0,h-1); const idx=(y*w+x)*4, gidx=(gy*w+gx)*4; d[idx]=clamp(d[idx]*(1-op)+cp[gidx]*op,0,255); d[idx+1]=clamp(d[idx+1]*(1-op)+cp[gidx+1]*op,0,255); d[idx+2]=clamp(d[idx+2]*(1-op)+cp[gidx+2]*op,0,255); } }
                if (pc.edgeBurn>0) { const bi=pc.edgeBurn/100; for (let y=0; y<h; y++) for (let x=0; x<w; x++) { const dist=Math.min(x,w-x,y,h-y)/Math.min(w,h); if (dist<0.15) { const burn=(1-dist/0.15)*bi*80; const idx=(y*w+x)*4; d[idx]=clamp(d[idx]-burn,0,255); d[idx+1]=clamp(d[idx+1]-burn,0,255); d[idx+2]=clamp(d[idx+2]-burn,0,255); } } }
                octx.putImageData(imgData,0,0);
            }

            function applyGrungeEffect(octx, w, h) {
                const g = state.grunge;
                const imgData = octx.getImageData(0,0,w,h);
                const d = imgData.data;
                if (g.paperGrain>0) { const gi=g.paperGrain/100*40; for (let i=0; i<d.length; i+=4) { const n=(Math.random()-0.5)*gi*2; d[i]=clamp(d[i]+n,0,255); d[i+1]=clamp(d[i+1]+n,0,255); d[i+2]=clamp(d[i+2]+n,0,255); } }
                if (g.dust>0) { const cnt=Math.round(g.dust/100*w*h*0.03); for (let i=0; i<cnt; i++) { const sx=Math.floor(Math.random()*w), sy=Math.floor(Math.random()*h); const idx=(sy*w+sx)*4; const dv=180+Math.random()*75; d[idx]=d[idx+1]=d[idx+2]=dv; } }
                if (g.scratches>0) { const cnt=Math.round(g.scratches/100*w*0.04); for (let i=0; i<cnt; i++) { const sx=Math.floor(Math.random()*w), sy=Math.floor(Math.random()*h); const len=Math.ceil(Math.random()*30)+5; for (let j=0; j<len; j++) { const nx=sx+j, ny=sy+Math.floor((Math.random()-0.5)*3); if (nx<w&&ny>=0&&ny<h) { const idx=(ny*w+nx)*4; d[idx]=clamp(d[idx]*0.4+220*0.6,0,255); d[idx+1]=clamp(d[idx+1]*0.4+220*0.6,0,255); d[idx+2]=clamp(d[idx+2]*0.4+220*0.6,0,255); } } } }
                if (g.stains>0) { const cnt=Math.round(g.stains/100*5); for (let i=0; i<cnt; i++) { const cx=Math.floor(Math.random()*w), cy=Math.floor(Math.random()*h), rad=Math.ceil(Math.random()*40)+10, op=Math.random()*0.3+0.1; for (let dy=-rad; dy<=rad; dy++) for (let dx=-rad; dx<=rad; dx++) { if (dx*dx+dy*dy<=rad*rad) { const nx=cx+dx, ny=cy+dy; if (nx>=0&&nx<w&&ny>=0&&ny<h) { const idx=(ny*w+nx)*4; const df=1-Math.sqrt(dx*dx+dy*dy)/rad; const sv=160+df*60; d[idx]=clamp(d[idx]*(1-op)+sv*op,0,255); d[idx+1]=clamp(d[idx+1]*(1-op)+(sv-10)*op,0,255); d[idx+2]=clamp(d[idx+2]*(1-op)+(sv-20)*op,0,255); } } } } }
                if (g.inkBleed>0) { const r=Math.round(g.inkBleed/10*3); if (r>=1) { const cp=new Uint8ClampedArray(d); for (let y=r; y<h-r; y++) for (let x=r; x<w-r; x++) { const idx=(y*w+x)*4; const lum=0.299*d[idx]+0.587*d[idx+1]+0.114*d[idx+2]; if (lum<100) { let minLum=lum; for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++) { const nidx=((y+dy)*w+(x+dx))*4; const nl=0.299*cp[nidx]+0.587*cp[nidx+1]+0.114*cp[nidx+2]; minLum=Math.min(minLum,nl); } d[idx]=clamp(d[idx]*0.7+minLum*0.3,0,255); d[idx+1]=clamp(d[idx+1]*0.7+minLum*0.3,0,255); d[idx+2]=clamp(d[idx+2]*0.7+minLum*0.3,0,255); } } } }
                if (g.fadedPrint>0) { const fa=g.fadedPrint/100*0.5; for (let i=0; i<d.length; i+=4) { d[i]=clamp(d[i]+(220-d[i])*fa,0,255); d[i+1]=clamp(d[i+1]+(220-d[i+1])*fa,0,255); d[i+2]=clamp(d[i+2]+(220-d[i+2])*fa,0,255); } }
                if (g.roughBorder>0) { const bw=Math.round(g.roughBorder/100*Math.min(w,h)*0.06); for (let y=0; y<h; y++) for (let x=0; x<w; x++) { const dist=Math.min(x,w-x,y,h-y); if (dist<bw && Math.random()>0.5) { const idx=(y*w+x)*4; d[idx]=clamp(d[idx]*0.6+200*0.4,0,255); d[idx+1]=clamp(d[idx+1]*0.6+200*0.4,0,255); d[idx+2]=clamp(d[idx+2]*0.6+200*0.4,0,255); } } }
                if (g.printMisregistration>0) { const sx=Math.round(g.printMisregistration/10*4), sy=Math.round(g.printMisregistration/10*3); const cp=new Uint8ClampedArray(d); for (let y=0; y<h; y++) for (let x=0; x<w; x++) { const rx=clamp(x+sx,0,w-1), by=clamp(y+sy,0,h-1); const idx=(y*w+x)*4; d[idx]=cp[(y*w+rx)*4]; d[idx+2]=cp[(by*w+x)*4+2]; } }
                if (g.randomDistress>0) { const cnt=Math.round(g.randomDistress/100*w*h*0.015); for (let i=0; i<cnt; i++) { const sx=Math.floor(Math.random()*w), sy=Math.floor(Math.random()*h), rad=Math.ceil(Math.random()*5)+1; for (let dy=-rad; dy<=rad; dy++) for (let dx=-rad; dx<=rad; dx++) { if (Math.random()<0.6) { const nx=sx+dx, ny=sy+dy; if (nx>=0&&nx<w&&ny>=0&&ny<h) { const idx=(ny*w+nx)*4; const dv=Math.round(Math.random()*255); d[idx]=d[idx+1]=d[idx+2]=dv; } } } } }
                octx.putImageData(imgData,0,0);
            }

            function applyGrain(octx, w, h) {
                const total = state.grainAmount + state.filmGrain;
                if (total <= 0) return;
                createGrainTexture(w, h, total, state.grainSize);
                const imgData = octx.getImageData(0,0,w,h);
                const d = imgData.data;
                const gd = grainCtx.getImageData(0,0,w,h).data;
                for (let i=0; i<d.length; i+=4) {
                    const alpha = gd[i+3]/255;
                    const gVal = gd[i];
                    d[i] = clamp(d[i]*(1-alpha) + gVal*alpha, 0,255);
                    d[i+1] = clamp(d[i+1]*(1-alpha) + gVal*alpha, 0,255);
                    d[i+2] = clamp(d[i+2]*(1-alpha) + gVal*alpha, 0,255);
                }
                octx.putImageData(imgData,0,0);
            }

            function applyVignette(octx, w, h) {
                const total = state.vignette + state.filmVignette;
                if (total <= 0) return;
                const imgData = octx.getImageData(0,0,w,h);
                const d = imgData.data;
                const cx = w/2, cy = h/2, maxDist = Math.sqrt(cx*cx+cy*cy), intensity = total/100;
                for (let y=0; y<h; y++) {
                    for (let x=0; x<w; x++) {
                        const dist = Math.sqrt((x-cx)**2 + (y-cy)**2) / maxDist;
                        const factor = 1 - Math.pow(dist, 2.5) * intensity;
                        const idx = (y*w+x)*4;
                        d[idx] = clamp(d[idx]*factor, 0,255);
                        d[idx+1] = clamp(d[idx+1]*factor, 0,255);
                        d[idx+2] = clamp(d[idx+2]*factor, 0,255);
                    }
                }
                octx.putImageData(imgData,0,0);
            }

            function applyBorder(octx, w, h) {
                if (state.borderThickness <= 0) return;
                const bp = Math.round(state.borderThickness/100 * Math.min(w,h) * 0.15);
                if (bp < 1) return;
                const imgData = octx.getImageData(0,0,w,h);
                const d = imgData.data;
                const val = state.borderColor === 'white' ? 255 : 0;
                for (let y=0; y<h; y++) {
                    for (let x=0; x<w; x++) {
                        const dist = Math.min(x, w-1-x, y, h-1-y);
                        if (dist < bp) {
                            const blend = dist / bp;
                            const idx = (y*w+x)*4;
                            d[idx] = clamp(d[idx]*blend + val*(1-blend), 0,255);
                            d[idx+1] = clamp(d[idx+1]*blend + val*(1-blend), 0,255);
                            d[idx+2] = clamp(d[idx+2]*blend + val*(1-blend), 0,255);
                        }
                    }
                }
                octx.putImageData(imgData,0,0);
            }

            // ── main render ──
            function renderImage() {
                if (!state.originalImage || state.isProcessing) return;
                showProcessing();
                requestAnimationFrame(() => {
                    try {
                        const dims = getWorkingDimensions();
                        let w = dims.w, h = dims.h;
                        if (w===0||h===0) { hideProcessing(); return; }
                        const display = getScaledDimensions(w, h, 1400);
                        const dw = display.w, dh = display.h;
                        const scale = Math.min(1, 1600/Math.max(w,h));
                        const pw = Math.round(w*scale), ph = Math.round(h*scale);
                        offscreenCanvas.width = pw; offscreenCanvas.height = ph;
                        const octx = offscreenCtx;
                        octx.fillStyle = '#fff'; octx.fillRect(0,0,pw,ph);
                        octx.save();
                        octx.translate(pw/2, ph/2);
                        if (state.flipH) octx.scale(-1,1);
                        if (state.flipV) octx.scale(1,-1);
                        if (state.rotation !== 0) octx.rotate(state.rotation*Math.PI/180);
                        const oW = state.originalImage.width, oH = state.originalImage.height;
                        let sx=0, sy=0, sw=oW, sh=oH;
                        const ratios = { original: oW/oH, '1:1':1, '4:5':4/5, '3:2':3/2, '4:3':4/3, '16:9':16/9 };
                        const target = ratios[state.cropAspect] || oW/oH;
                        if (state.cropAspect !== 'original') {
                            if (oW/oH > target) { sw = Math.round(oH*target); sx = Math.round((oW-sw)/2); }
                            else { sh = Math.round(oW/target); sy = Math.round((oH-sh)/2); }
                        }
                        const drawW = state.rotation%180!==0 ? ph : pw;
                        const drawH = state.rotation%180!==0 ? pw : ph;
                        octx.drawImage(state.originalImage, sx, sy, sw, sh, -drawW/2, -drawH/2, drawW, drawH);
                        octx.restore();
                        applyBasicAdjustments(octx, pw, ph);
                        applyFilmPreset(octx, pw, ph);
                        if (state.asciiEnabled) applyAsciiEffect(octx, pw, ph);
                        if (state.ditherEnabled) applyDitherEffect(octx, pw, ph);
                        if (state.halftoneEnabled) applyHalftoneEffect(octx, pw, ph);
                        if (state.dotsEnabled) applyDotsEffect(octx, pw, ph);
                        if (state.pixelSortEnabled) applyPixelSortEffect(octx, pw, ph);
                        if (state.vhsEnabled) applyVHSEffect(octx, pw, ph);
                        if (state.photocopierEnabled) applyPhotocopierEffect(octx, pw, ph);
                        if (state.grungeEnabled) applyGrungeEffect(octx, pw, ph);
                        applyGrain(octx, pw, ph);
                        applyVignette(octx, pw, ph);
                        applyBorder(octx, pw, ph);
                        mainCanvas.width = dw; mainCanvas.height = dh;
                        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,dw,dh);
                        ctx.drawImage(offscreenCanvas, 0, 0, dw, dh);
                        canvasInfo.textContent = `${dw}×${dh} px | ${state.imageFilename}`;
                        hideProcessing();
                    } catch(e) { console.error(e); hideProcessing(); }
                });
            }
            const debouncedRender = debounce(renderImage, 80);

            // ── UI helpers ──
            function slider(label, get, set, min, max, step) {
                const grp = document.createElement('div'); grp.className='control-group';
                const lbl = document.createElement('label');
                const span = document.createElement('span'); span.className='val'; span.textContent = Math.round(get());
                lbl.textContent = label; lbl.appendChild(span);
                const input = document.createElement('input'); input.type='range'; input.min=min; input.max=max; input.step=step; input.value=get();
                input.addEventListener('input', () => { set(parseFloat(input.value)); span.textContent = Math.round(get()); debouncedRender(); });
                grp.appendChild(lbl); grp.appendChild(input);
                const rst = document.createElement('button'); rst.className='btn-mini'; rst.textContent='Reset';
                rst.addEventListener('click', () => { set(0); input.value=0; span.textContent='0'; debouncedRender(); });
                grp.appendChild(rst);
                return grp;
            }
            function toggle(label, get, set) {
                const div = document.createElement('div'); div.className='toggle-row';
                const lbl = document.createElement('label');
                const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = get();
                cb.addEventListener('change', () => { set(cb.checked); debouncedRender(); });
                lbl.appendChild(cb); lbl.appendChild(document.createTextNode(' '+label));
                div.appendChild(lbl);
                return div;
            }
            function select(label, get, set, opts) {
                const grp = document.createElement('div'); grp.className='control-group';
                const lbl = document.createElement('label'); lbl.textContent = label;
                const sel = document.createElement('select');
                opts.forEach(o => { const el = document.createElement('option'); el.value=o.value; el.textContent=o.label; sel.appendChild(el); });
                sel.value = get();
                sel.addEventListener('change', () => { set(sel.value); debouncedRender(); });
                grp.appendChild(lbl); grp.appendChild(sel);
                return grp;
            }
            function section(title, build) {
                const sec = document.createElement('div'); sec.className='panel-section';
                const hdr = document.createElement('button'); hdr.className='panel-section-header';
                hdr.innerHTML = `${title} <span class="collapse-icon">▼</span>`;
                const cnt = document.createElement('div'); cnt.className='panel-section-content';
                hdr.addEventListener('click', () => { cnt.classList.toggle('collapsed'); hdr.classList.toggle('collapsed'); });
                build(cnt);
                sec.appendChild(hdr); sec.appendChild(cnt);
                return sec;
            }

            function buildPanel() {
                rightPanelInner.innerHTML = '';
                const p = rightPanelInner;
                const cat = state.activeCategory;
                if (!state.originalImage && cat!=='basic' && cat!=='export') { p.innerHTML='<p class="info-text">No image loaded.</p>'; return; }
                switch(cat) {
                    case 'basic':
                        p.appendChild(section('Crop', c => {
                            c.appendChild(select('Aspect', ()=>state.cropAspect, v=>state.cropAspect=v, [
                                {value:'original',label:'Original'},{value:'1:1',label:'1:1'},{value:'4:5',label:'4:5'},{value:'3:2',label:'3:2'},{value:'4:3',label:'4:3'},{value:'16:9',label:'16:9'}
                            ]));
                            const btns = document.createElement('div'); btns.style.display='flex'; btns.style.gap='0.2rem';
                            ['Rot L','Rot R','Flip H','Flip V'].forEach((t,i) => {
                                const b = document.createElement('button'); b.className='btn-mini'; b.textContent=t;
                                b.onclick = () => { if(i===0) state.rotation=(state.rotation-90)%360; if(i===1) state.rotation=(state.rotation+90)%360; if(i===2) state.flipH=!state.flipH; if(i===3) state.flipV=!state.flipV; debouncedRender(); };
                                btns.appendChild(b);
                            });
                            c.appendChild(btns);
                        }));
                        p.appendChild(section('Tone', c => {
                            c.appendChild(slider('Exposure', ()=>state.exposure, v=>state.exposure=v, -100,100,1));
                            c.appendChild(slider('Brightness', ()=>state.brightness, v=>state.brightness=v, -100,100,1));
                            c.appendChild(slider('Contrast', ()=>state.contrast, v=>state.contrast=v, -100,100,1));
                            c.appendChild(slider('Highlights', ()=>state.highlights, v=>state.highlights=v, -100,100,1));
                            c.appendChild(slider('Shadows', ()=>state.shadows, v=>state.shadows=v, -100,100,1));
                            c.appendChild(slider('Whites', ()=>state.whites, v=>state.whites=v, -100,100,1));
                            c.appendChild(slider('Blacks', ()=>state.blacks, v=>state.blacks=v, -100,100,1));
                            c.appendChild(slider('Saturation', ()=>state.saturation, v=>state.saturation=v, -100,100,1));
                            c.appendChild(slider('Vibrance', ()=>state.vibrance, v=>state.vibrance=v, -100,100,1));
                            c.appendChild(slider('Temperature', ()=>state.temperature, v=>state.temperature=v, -100,100,1));
                            c.appendChild(slider('Tint', ()=>state.tint, v=>state.tint=v, -100,100,1));
                        }));
                        p.appendChild(section('Detail', c => {
                            c.appendChild(slider('Sharpen', ()=>state.sharpen, v=>state.sharpen=v, 0,100,1));
                            c.appendChild(slider('Clarity', ()=>state.clarity, v=>state.clarity=v, 0,100,1));
                            c.appendChild(slider('Grain', ()=>state.grainAmount, v=>state.grainAmount=v, 0,100,1));
                            c.appendChild(slider('Grain Size', ()=>state.grainSize, v=>state.grainSize=v, 0.3,5,0.1));
                        }));
                        p.appendChild(section('Finishing', c => {
                            c.appendChild(slider('Vignette', ()=>state.vignette, v=>state.vignette=v, 0,100,1));
                            c.appendChild(slider('Fade', ()=>state.fade, v=>state.fade=v, 0,100,1));
                        }));
                        break;
                    case 'filmstocks':
                        p.appendChild(section('Colour', c => {
                            const g = document.createElement('div'); g.className='presets-grid';
                            filmPresets.filter(x=>x.type==='colour').forEach(pr => {
                                const b = document.createElement('button'); b.className='preset-btn'; b.textContent=pr.name;
                                if (state.activeFilmPreset===pr.name) b.classList.add('active-preset');
                                b.onclick = () => { state.activeFilmPreset = state.activeFilmPreset===pr.name ? null : pr.name; buildPanel(); debouncedRender(); };
                                g.appendChild(b);
                            });
                            c.appendChild(g);
                        }));
                        p.appendChild(section('B&W', c => {
                            const g = document.createElement('div'); g.className='presets-grid';
                            filmPresets.filter(x=>x.type==='bw').forEach(pr => {
                                const b = document.createElement('button'); b.className='preset-btn'; b.textContent=pr.name;
                                if (state.activeFilmPreset===pr.name) b.classList.add('active-preset');
                                b.onclick = () => { state.activeFilmPreset = state.activeFilmPreset===pr.name ? null : pr.name; buildPanel(); debouncedRender(); };
                                g.appendChild(b);
                            });
                            c.appendChild(g);
                        }));
                        p.appendChild(section('Global', c => {
                            c.appendChild(slider('Intensity', ()=>state.filmIntensity, v=>state.filmIntensity=v, 0,100,1));
                            c.appendChild(slider('Grain', ()=>state.filmGrain, v=>state.filmGrain=v, 0,100,1));
                            c.appendChild(slider('Fade', ()=>state.filmFade, v=>state.filmFade=v, 0,100,1));
                            c.appendChild(slider('Halation', ()=>state.filmHalation, v=>state.filmHalation=v, 0,100,1));
                            c.appendChild(slider('Vignette', ()=>state.filmVignette, v=>state.filmVignette=v, 0,100,1));
                        }));
                        break;
                    case 'ascii':
                        p.appendChild(toggle('Enable', ()=>state.asciiEnabled, v=>state.asciiEnabled=v));
                        p.appendChild(slider('Density', ()=>state.ascii.charDensity, v=>state.ascii.charDensity=v, 10,100,1));
                        p.appendChild(slider('Size', ()=>state.ascii.charSize, v=>state.ascii.charSize=v, 2,30,1));
                        p.appendChild(toggle('Invert', ()=>state.ascii.invert, v=>state.ascii.invert=v));
                        p.appendChild(toggle('Monochrome', ()=>state.ascii.monochrome, v=>state.ascii.monochrome=v));
                        p.appendChild(select('Char Set', ()=>state.ascii.charSet, v=>state.ascii.charSet=v, [
                            {value:'standard',label:'Standard'},{value:'blocks',label:'Blocks'},{value:'symbols',label:'Symbols'},{value:'minimal',label:'Minimal'}
                        ]));
                        break;
                    case 'dither':
                        p.appendChild(toggle('Enable', ()=>state.ditherEnabled, v=>state.ditherEnabled=v));
                        p.appendChild(select('Method', ()=>state.dither.method, v=>state.dither.method=v, [
                            {value:'ordered',label:'Ordered'},{value:'floyd',label:'Floyd-Steinberg'},{value:'atkinson',label:'Atkinson'},{value:'bayer',label:'Bayer'}
                        ]));
                        p.appendChild(slider('Threshold', ()=>state.dither.threshold, v=>state.dither.threshold=v, 0,255,1));
                        p.appendChild(slider('Levels', ()=>state.dither.levels, v=>state.dither.levels=v, 2,8,1));
                        p.appendChild(slider('Pixel Size', ()=>state.dither.pixelSize, v=>state.dither.pixelSize=v, 1,8,1));
                        p.appendChild(toggle('Monochrome', ()=>state.dither.monochrome, v=>state.dither.monochrome=v));
                        p.appendChild(toggle('Invert', ()=>state.dither.invert, v=>state.dither.invert=v));
                        break;
                    case 'halftone':
                        p.appendChild(toggle('Enable', ()=>state.halftoneEnabled, v=>state.halftoneEnabled=v));
                        p.appendChild(slider('Dot Size', ()=>state.halftone.dotSize, v=>state.halftone.dotSize=v, 1,20,1));
                        p.appendChild(slider('Spacing', ()=>state.halftone.spacing, v=>state.halftone.spacing=v, 2,30,1));
                        p.appendChild(slider('Angle', ()=>state.halftone.angle, v=>state.halftone.angle=v, 0,180,1));
                        p.appendChild(slider('Contrast', ()=>state.halftone.contrast, v=>state.halftone.contrast=v, 0,100,1));
                        p.appendChild(toggle('Monochrome', ()=>state.halftone.monochrome, v=>state.halftone.monochrome=v));
                        p.appendChild(select('Shape', ()=>state.halftone.shape, v=>state.halftone.shape=v, [
                            {value:'round',label:'Round'},{value:'square',label:'Square'},{value:'line',label:'Line'}
                        ]));
                        p.appendChild(slider('Misreg.', ()=>state.halftone.misregistration, v=>state.halftone.misregistration=v, 0,20,1));
                        break;
                    case 'dots':
                        p.appendChild(toggle('Enable', ()=>state.dotsEnabled, v=>state.dotsEnabled=v));
                        p.appendChild(slider('Dot Size', ()=>state.dots.dotSize, v=>state.dots.dotSize=v, 1,20,1));
                        p.appendChild(slider('Spacing', ()=>state.dots.spacing, v=>state.dots.spacing=v, 3,30,1));
                        p.appendChild(slider('Density', ()=>state.dots.density, v=>state.dots.density=v, 10,100,1));
                        p.appendChild(toggle('Monochrome', ()=>state.dots.monochrome, v=>state.dots.monochrome=v));
                        p.appendChild(slider('Jitter', ()=>state.dots.jitter, v=>state.dots.jitter=v, 0,20,1));
                        p.appendChild(slider('Roundness', ()=>state.dots.roundness, v=>state.dots.roundness=v, 10,100,1));
                        break;
                    case 'pixelsort':
                        p.appendChild(toggle('Enable', ()=>state.pixelSortEnabled, v=>state.pixelSortEnabled=v));
                        p.appendChild(select('Direction', ()=>state.pixelSort.direction, v=>state.pixelSort.direction=v, [
                            {value:'horizontal',label:'Horizontal'},{value:'vertical',label:'Vertical'}
                        ]));
                        p.appendChild(slider('Threshold', ()=>state.pixelSort.threshold, v=>state.pixelSort.threshold=v, 0,255,1));
                        p.appendChild(slider('Amount', ()=>state.pixelSort.amount, v=>state.pixelSort.amount=v, 0,100,1));
                        p.appendChild(select('Basis', ()=>state.pixelSort.basis, v=>state.pixelSort.basis=v, [
                            {value:'luminance',label:'Luminance'},{value:'red',label:'Red'},{value:'green',label:'Green'},{value:'blue',label:'Blue'}
                        ]));
                        p.appendChild(slider('Randomness', ()=>state.pixelSort.randomness, v=>state.pixelSort.randomness=v, 0,100,1));
                        p.appendChild(slider('Blend', ()=>state.pixelSort.blendAmount, v=>state.pixelSort.blendAmount=v, 0,100,1));
                        break;
                    case 'vhs':
                        p.appendChild(toggle('Enable', ()=>state.vhsEnabled, v=>state.vhsEnabled=v));
                        p.appendChild(toggle('Scanlines', ()=>state.vhs.scanlines, v=>state.vhs.scanlines=v));
                        p.appendChild(slider('Noise', ()=>state.vhs.noise, v=>state.vhs.noise=v, 0,100,1));
                        p.appendChild(slider('RGB Shift', ()=>state.vhs.rgbShift, v=>state.vhs.rgbShift=v, 0,15,1));
                        p.appendChild(slider('Wobble', ()=>state.vhs.wobble, v=>state.vhs.wobble=v, 0,10,1));
                        p.appendChild(slider('Blur', ()=>state.vhs.blur, v=>state.vhs.blur=v, 0,10,1));
                        p.appendChild(slider('Colour Bleed', ()=>state.vhs.colourBleed, v=>state.vhs.colourBleed=v, 0,100,1));
                        p.appendChild(slider('Tracking', ()=>state.vhs.trackingLines, v=>state.vhs.trackingLines=v, 0,100,1));
                        p.appendChild(slider('Sat. Decay', ()=>state.vhs.saturationDecay, v=>state.vhs.saturationDecay=v, 0,100,1));
                        break;
                    case 'photocopier':
                        p.appendChild(toggle('Enable', ()=>state.photocopierEnabled, v=>state.photocopierEnabled=v));
                        const pcPresets = [{name:'Clean Office Copy',s:{bwThreshold:128,tonerDensity:50,contrastCrush:20,blownHighlights:5,dirtyShadows:5,paperGrey:8,tonerSpeckles:5,dust:2,verticalStreaks:3,copyMisalignment:1,doubleCopyGhost:0,edgeBurn:5}},{name:'Punk Flyer',s:{bwThreshold:155,tonerDensity:75,contrastCrush:65,blownHighlights:35,dirtyShadows:40,paperGrey:18,tonerSpeckles:28,dust:20,verticalStreaks:18,copyMisalignment:8,doubleCopyGhost:14,edgeBurn:25}}];
                        const pcGrid = document.createElement('div'); pcGrid.className='presets-grid';
                        pcPresets.forEach(pr => { const b=document.createElement('button'); b.className='preset-btn'; b.textContent=pr.name; b.onclick=()=>{Object.assign(state.photocopier,pr.s); buildPanel(); debouncedRender();}; pcGrid.appendChild(b); });
                        p.appendChild(pcGrid);
                        p.appendChild(slider('Threshold', ()=>state.photocopier.bwThreshold, v=>state.photocopier.bwThreshold=v, 0,255,1));
                        p.appendChild(slider('Toner', ()=>state.photocopier.tonerDensity, v=>state.photocopier.tonerDensity=v, 0,100,1));
                        p.appendChild(slider('Contrast Crush', ()=>state.photocopier.contrastCrush, v=>state.photocopier.contrastCrush=v, 0,100,1));
                        p.appendChild(slider('Blown Highlights', ()=>state.photocopier.blownHighlights, v=>state.photocopier.blownHighlights=v, 0,100,1));
                        p.appendChild(slider('Dirty Shadows', ()=>state.photocopier.dirtyShadows, v=>state.photocopier.dirtyShadows=v, 0,100,1));
                        p.appendChild(slider('Paper Grey', ()=>state.photocopier.paperGrey, v=>state.photocopier.paperGrey=v, 0,60,1));
                        p.appendChild(slider('Speckles', ()=>state.photocopier.tonerSpeckles, v=>state.photocopier.tonerSpeckles=v, 0,100,1));
                        p.appendChild(slider('Dust', ()=>state.photocopier.dust, v=>state.photocopier.dust=v, 0,100,1));
                        p.appendChild(slider('Streaks', ()=>state.photocopier.verticalStreaks, v=>state.photocopier.verticalStreaks=v, 0,100,1));
                        p.appendChild(slider('Misalignment', ()=>state.photocopier.copyMisalignment, v=>state.photocopier.copyMisalignment=v, 0,20,1));
                        p.appendChild(slider('Ghosting', ()=>state.photocopier.doubleCopyGhost, v=>state.photocopier.doubleCopyGhost=v, 0,100,1));
                        p.appendChild(slider('Edge Burn', ()=>state.photocopier.edgeBurn, v=>state.photocopier.edgeBurn=v, 0,100,1));
                        break;
                    case 'grunge':
                        p.appendChild(toggle('Enable', ()=>state.grungeEnabled, v=>state.grungeEnabled=v));
                        const grPresets = [{name:'Grunge Poster',s:{dust:20,scratches:15,stains:12,paperGrain:30,tornEdge:10,inkBleed:12,smudge:10,fadedPrint:18,wallTexture:15,posterPaste:12,roughBorder:22,printMisregistration:8,randomDistress:12}},{name:'Punk Zine',s:{dust:25,scratches:20,stains:18,paperGrain:35,tornEdge:14,inkBleed:18,smudge:14,fadedPrint:22,wallTexture:10,posterPaste:15,roughBorder:28,printMisregistration:12,randomDistress:18}}];
                        const grGrid = document.createElement('div'); grGrid.className='presets-grid';
                        grPresets.forEach(pr => { const b=document.createElement('button'); b.className='preset-btn'; b.textContent=pr.name; b.onclick=()=>{Object.assign(state.grunge,pr.s); buildPanel(); debouncedRender();}; grGrid.appendChild(b); });
                        p.appendChild(grGrid);
                        p.appendChild(slider('Dust', ()=>state.grunge.dust, v=>state.grunge.dust=v, 0,100,1));
                        p.appendChild(slider('Scratches', ()=>state.grunge.scratches, v=>state.grunge.scratches=v, 0,100,1));
                        p.appendChild(slider('Stains', ()=>state.grunge.stains, v=>state.grunge.stains=v, 0,100,1));
                        p.appendChild(slider('Paper Grain', ()=>state.grunge.paperGrain, v=>state.grunge.paperGrain=v, 0,100,1));
                        p.appendChild(slider('Torn Edge', ()=>state.grunge.tornEdge, v=>state.grunge.tornEdge=v, 0,100,1));
                        p.appendChild(slider('Ink Bleed', ()=>state.grunge.inkBleed, v=>state.grunge.inkBleed=v, 0,100,1));
                        p.appendChild(slider('Smudge', ()=>state.grunge.smudge, v=>state.grunge.smudge=v, 0,100,1));
                        p.appendChild(slider('Faded Print', ()=>state.grunge.fadedPrint, v=>state.grunge.fadedPrint=v, 0,100,1));
                        p.appendChild(slider('Rough Border', ()=>state.grunge.roughBorder, v=>state.grunge.roughBorder=v, 0,100,1));
                        p.appendChild(slider('Misreg.', ()=>state.grunge.printMisregistration, v=>state.grunge.printMisregistration=v, 0,30,1));
                        break;
                    case 'borders':
                        p.appendChild(slider('Thickness', ()=>state.borderThickness, v=>state.borderThickness=v, 0,100,1));
                        p.appendChild(select('Colour', ()=>state.borderColor, v=>state.borderColor=v, [{value:'white',label:'White'},{value:'black',label:'Black'}]));
                        break;
                    case 'export':
                        p.appendChild(select('Format', ()=>state.exportFormat, v=>state.exportFormat=v, [{value:'png',label:'PNG'},{value:'jpeg',label:'JPEG'}]));
                        if (state.exportFormat==='jpeg') p.appendChild(slider('Quality', ()=>state.jpegQuality, v=>state.jpegQuality=v, 10,100,1));
                        p.appendChild(toggle('Include Border', ()=>state.exportIncludeBorder, v=>state.exportIncludeBorder=v));
                        const expBtn = document.createElement('button'); expBtn.className='preset-btn'; expBtn.textContent='Export Now';
                        expBtn.onclick = () => exportImage(state.exportFormat);
                        p.appendChild(expBtn);
                        break;
                }
            }

            function exportImage(format) {
                if (!state.originalImage) return;
                const dims = getWorkingDimensions(); let w = dims.w, h = dims.h;
                const expCanvas = document.createElement('canvas'); expCanvas.width = w; expCanvas.height = h;
                const expCtx = expCanvas.getContext('2d');
                const scale = Math.min(1, 2000/Math.max(w,h));
                const pw = Math.round(w*scale), ph = Math.round(h*scale);
                const tmp = document.createElement('canvas'); tmp.width = pw; tmp.height = ph;
                const tctx = tmp.getContext('2d');
                tctx.fillStyle = '#fff'; tctx.fillRect(0,0,pw,ph);
                tctx.save(); tctx.translate(pw/2, ph/2);
                if (state.flipH) tctx.scale(-1,1); if (state.flipV) tctx.scale(1,-1);
                if (state.rotation) tctx.rotate(state.rotation*Math.PI/180);
                const oW=state.originalImage.width, oH=state.originalImage.height;
                let sx=0,sy=0,sw=oW,sh=oH;
                const ratios = { original: oW/oH, '1:1':1, '4:5':4/5, '3:2':3/2, '4:3':4/3, '16:9':16/9 };
                const target = ratios[state.cropAspect]||oW/oH;
                if (state.cropAspect!=='original') { if (oW/oH>target) { sw=Math.round(oH*target); sx=Math.round((oW-sw)/2); } else { sh=Math.round(oW/target); sy=Math.round((oH-sh)/2); } }
                const dW = state.rotation%180!==0 ? ph : pw, dH = state.rotation%180!==0 ? pw : ph;
                tctx.drawImage(state.originalImage, sx, sy, sw, sh, -dW/2, -dH/2, dW, dH);
                tctx.restore();
                applyBasicAdjustments(tctx, pw, ph); applyFilmPreset(tctx, pw, ph);
                if (state.asciiEnabled) applyAsciiEffect(tctx, pw, ph);
                if (state.ditherEnabled) applyDitherEffect(tctx, pw, ph);
                if (state.halftoneEnabled) applyHalftoneEffect(tctx, pw, ph);
                if (state.dotsEnabled) applyDotsEffect(tctx, pw, ph);
                if (state.pixelSortEnabled) applyPixelSortEffect(tctx, pw, ph);
                if (state.vhsEnabled) applyVHSEffect(tctx, pw, ph);
                if (state.photocopierEnabled) applyPhotocopierEffect(tctx, pw, ph);
                if (state.grungeEnabled) applyGrungeEffect(tctx, pw, ph);
                applyGrain(tctx, pw, ph); applyVignette(tctx, pw, ph);
                if (state.exportIncludeBorder) applyBorder(tctx, pw, ph);
                expCtx.drawImage(tmp, 0, 0, w, h);
                const mime = format==='jpeg' ? 'image/jpeg' : 'image/png';
                const quality = format==='jpeg' ? state.jpegQuality/100 : undefined;
                const url = expCanvas.toDataURL(mime, quality);
                const a = document.createElement('a'); a.download = (state.imageFilename||'walduslab').replace(/\.[^.]+$/,'')+'_edited.'+(format==='jpeg'?'jpg':'png'); a.href = url; a.click();
            }

            // ── events ──
            btnUpload.onclick = () => fileInput.click();
            fileInput.onchange = e => { if (e.target.files[0]) loadImage(e.target.files[0]); };
            btnExportPNG.onclick = () => exportImage('png');
            btnExportJPEG.onclick = () => exportImage('jpeg');
            btnReset.onclick = () => {
                Object.assign(state, {
                    exposure:0,brightness:0,contrast:0,saturation:0,vibrance:0,temperature:0,tint:0,
                    highlights:0,shadows:0,whites:0,blacks:0,sharpen:0,clarity:0,grainAmount:0,vignette:0,fade:0,borderThickness:0,
                    asciiEnabled:false,ditherEnabled:false,halftoneEnabled:false,dotsEnabled:false,pixelSortEnabled:false,vhsEnabled:false,photocopierEnabled:false,grungeEnabled:false,
                    activeFilmPreset:null,
                });
                buildPanel(); debouncedRender();
            };
            btnCompare.onclick = () => {
                if (!state.originalImage) return;
                state.compareMode = !state.compareMode;
                if (state.compareMode) {
                    const dw = state.displayWidth || state.originalImage.width;
                    const dh = state.displayHeight || state.originalImage.height;
                    mainCanvas.width = dw; mainCanvas.height = dh;
                    ctx.drawImage(state.originalImage, 0, 0, dw, dh);
                } else renderImage();
            };
            canvasArea.addEventListener('dragover', e => e.preventDefault());
            canvasArea.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]); });
            dropHint.onclick = () => fileInput.click();
            sidebarButtons.forEach(b => b.onclick = () => {
                sidebarButtons.forEach(x => x.classList.remove('active'));
                b.classList.add('active');
                state.activeCategory = b.dataset.category;
                buildPanel();
            });

            function loadImage(file) {
                if (!file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        state.originalImage = img;
                        state.imageFilename = file.name;
                        state.imageMetadata = { width: img.width, height: img.height, type: file.type, size: file.size };
                        emptyState.style.display = 'none';
                        mainCanvas.style.display = 'block';
                        buildPanel();
                        renderImage();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            buildPanel();
        })();
    </script>
</body>
</html>
