<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaldusLAB — Creative Photo Laboratory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-ui: 'Inter', system-ui, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --bg: #ffffff;
            --fg: #111111;
            --border: #000000;
            --border-light: #d4d4d4;
            --hover-bg: #f5f5f5;
            --canvas-bg: #fafafa;
            --slider-track: #cccccc;
            --slider-thumb: #000000;
            --danger: #cc0000;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 15px; -webkit-font-smoothing: antialiased; }
        body { font-family: var(--font-ui); background: var(--bg); color: var(--fg); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
        .top-bar { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 2px solid var(--border); padding: 0 1rem; display: flex; align-items: center; gap: 0.75rem; min-height: 52px; flex-shrink: 0; flex-wrap: wrap; }
        .logo { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 600; }
        .app-title { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; margin-right: auto; }
        .top-bar button { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; padding: 0.4rem 0.75rem; border: 1.5px solid var(--border); background: var(--bg); cursor: pointer; white-space: nowrap; transition: all 0.12s; border-radius: 2px; }
        .top-bar button:hover { background: var(--fg); color: var(--bg); }
        .top-bar button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
        .btn-compare { border-style: dashed; }
        .btn-reset { border-color: var(--danger); color: var(--danger); }
        .btn-reset:hover { background: var(--danger); color: #fff; }
        .main-container { display: flex; flex: 1; min-height: 0; }
        .left-sidebar { width: 200px; flex-shrink: 0; border-right: 2px solid var(--border); background: var(--bg); padding: 0.75rem 0; display: flex; flex-direction: column; gap: 0.15rem; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px; }
        .left-sidebar button { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; padding: 0.55rem 1rem; border: none; background: transparent; cursor: pointer; text-align: left; border-left: 3px solid transparent; color: var(--fg); width: 100%; }
        .left-sidebar button:hover { background: var(--hover-bg); border-left-color: var(--border-light); }
        .left-sidebar button.active { background: var(--fg); color: var(--bg); border-left-color: var(--fg); font-weight: 600; }
        .sidebar-section-label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: #888; padding: 0.6rem 1rem 0.25rem; border-top: 1px solid var(--border-light); margin-top: 0.3rem; }
        .sidebar-section-label:first-child { border-top: none; margin-top: 0; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--canvas-bg); padding: 1.5rem; position: relative; min-height: 400px; overflow: auto; }
        .canvas-wrapper { position: relative; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 1px var(--border-light), 0 2px 16px rgba(0,0,0,0.06); background: #fff; max-width: 100%; }
        canvas { display: none; max-width: 100%; max-height: 70vh; object-fit: contain; }
        .empty-state { text-align: center; padding: 3rem 2rem; user-select: none; }
        .empty-state .asterisk-large { font-family: var(--font-mono); font-size: 5rem; font-weight: 300; display: block; margin-bottom: 1rem; color: #888; }
        .empty-state p { font-family: var(--font-mono); font-size: 0.8rem; color: #555; max-width: 320px; margin: 0 auto; }
        .drop-hint { margin-top: 1.5rem; font-size: 0.7rem; color: #888; border: 2px dashed var(--border-light); padding: 1.5rem 2rem; display: inline-block; border-radius: 4px; cursor: pointer; }
        .drop-hint:hover { border-color: var(--fg); }
        .canvas-info { position: absolute; bottom: 0.5rem; right: 0.75rem; font-family: var(--font-mono); font-size: 0.6rem; color: #888; letter-spacing: 0.04em; pointer-events: none; background: rgba(255,255,255,0.85); padding: 0.2rem 0.5rem; }
        .processing-overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.75rem; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
        .processing-overlay.visible { opacity: 1; }
        .right-panel { width: 300px; flex-shrink: 0; border-left: 2px solid var(--border); background: var(--bg); overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px; padding: 0.75rem 0; }
        .right-panel-inner { padding: 0 1rem; }
        .panel-section { margin-bottom: 0.5rem; border-bottom: 1px solid var(--border-light); padding-bottom: 0.5rem; }
        .panel-section-header { font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; padding: 0.5rem 0; display: flex; justify-content: space-between; user-select: none; border: none; background: none; width: 100%; color: var(--fg); }
        .panel-section-header .collapse-icon { transition: transform 0.2s; }
        .panel-section-header.collapsed .collapse-icon { transform: rotate(-90deg); }
        .panel-section-content { overflow: hidden; max-height: 2000px; transition: max-height 0.3s ease; }
        .panel-section-content.collapsed { max-height: 0; }
        .control-group { margin-bottom: 0.6rem; }
        .control-group label { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.65rem; margin-bottom: 0.2rem; }
        .control-group input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; background: var(--slider-track); border-radius: 2px; outline: none; }
        .control-group input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--slider-thumb); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); cursor: pointer; }
        .toggle-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .toggle-row label { font-family: var(--font-mono); font-size: 0.65rem; cursor: pointer; }
        .toggle-row input[type="checkbox"] { -webkit-appearance: none; width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 2px; cursor: pointer; position: relative; background: var(--bg); }
        .toggle-row input[type="checkbox"]:checked { background: var(--fg); }
        .toggle-row input[type="checkbox"]:checked::after { content: '✓'; position: absolute; top: -1px; left: 2px; font-size: 0.7rem; color: #fff; font-weight: 700; }
        .preset-btn { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.03em; padding: 0.35rem 0.6rem; border: 1.5px solid var(--border); background: var(--bg); cursor: pointer; margin: 0.15rem; border-radius: 2px; }
        .preset-btn:hover { background: var(--fg); color: var(--bg); }
        .preset-btn.active-preset { background: var(--fg); color: var(--bg); font-weight: 600; }
        .presets-grid { display: flex; flex-wrap: wrap; gap: 0.2rem; }
        .btn-mini { font-family: var(--font-mono); font-size: 0.55rem; padding: 0.2rem 0.4rem; border: 1px solid var(--border); background: var(--bg); cursor: pointer; }
        .btn-mini:hover { background: var(--fg); color: var(--bg); }
        .metadata-row { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.6rem; padding: 0.2rem 0; border-bottom: 1px dotted var(--border-light); }
        @media (max-width: 850px) {
            .main-container { flex-direction: column; }
            /* Horizontal pill-style nav toolbar */
            .left-sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; max-height: none; position: static; border-right: none; border-bottom: 2px solid var(--border); padding: 0.4rem 0.5rem; justify-content: center; gap: 0.3rem; }
            .left-sidebar button { width: auto; font-size: 0.6rem; padding: 0.35rem 0.65rem; border-left: none; border: 1.5px solid var(--border-light); border-radius: 2px; }
            .left-sidebar button.active { border-color: var(--border); }
            /* Hide section labels — they clutter the horizontal toolbar */
            .sidebar-section-label { display: none; }
            .right-panel { width: 100%; max-height: none; position: static; border-left: none; border-top: 2px solid var(--border); }
            canvas { max-height: 45vh; }
            .canvas-area { min-height: 280px; padding: 1rem; }
        }
        /* ── Mobile (≤600px) ─────────────────────────────── */
        @media (max-width: 600px) {
            /* Top bar: compact, one row — hide Export buttons (available in Export tab) */
            .top-bar { padding: 0 0.6rem; gap: 0.4rem; }
            .app-title { display: none; }
            #btnExportPNG, #btnExportJPEG { display: none; }
            .top-bar button { font-size: 0.65rem; padding: 0.35rem 0.55rem; }
            /* Slightly smaller nav pills */
            .left-sidebar { padding: 0.35rem 0.4rem; gap: 0.25rem; }
            .left-sidebar button { font-size: 0.58rem; padding: 0.3rem 0.5rem; }
            /* Right panel full padding */
            .right-panel-inner { padding: 0 0.75rem; }
            /* Canvas area */
            .canvas-area { min-height: 220px; padding: 0.75rem; }
            /* Empty state — compact on small screens */
            .empty-state { padding: 1.5rem 1rem; }
            .empty-state .asterisk-large { font-size: 3.5rem; margin-bottom: 0.5rem; }
            .drop-hint { padding: 1rem 1.25rem; }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <span class="logo">*</span>
        <span class="app-title">WaldusLAB</span>
        <button id="btnUpload">Upload Image</button>
        <button id="btnCompare" class="btn-compare">Compare Original</button>
        <button id="btnReset" class="btn-reset">Reset All</button>
        <button id="btnExportPNG">Export PNG</button>
        <button id="btnExportJPEG">Export JPEG</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
    </header>
    <div class="main-container">
        <nav class="left-sidebar">
            <span class="sidebar-section-label">Adjustments</span>
            <button data-category="basic" class="active">Basic</button>
            <button data-category="filmstocks">Film Stocks</button>
            <span class="sidebar-section-label">Effects</span>
            <button data-category="ascii">ASCII Art</button>
            <button data-category="dither">Dithering</button>
            <button data-category="halftone">Halftone</button>
            <button data-category="dots">Dots</button>
            <button data-category="pixelsort">Pixel Sort</button>
            <button data-category="vhs">VHS</button>
            <span class="sidebar-section-label">Styles</span>
            <button data-category="photocopier">Photocopier 90s</button>
            <button data-category="grunge">Grunge</button>
            <span class="sidebar-section-label">Output</span>
            <button data-category="borders">Borders</button>
            <button data-category="export">Export</button>
        </nav>
        <main class="canvas-area" id="canvasArea">
            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="mainCanvas"></canvas>
                <div class="empty-state" id="emptyState">
                    <span class="asterisk-large">*</span>
                    <p>Upload an image to begin editing.<br>WaldusLAB works entirely in your browser.</p>
                    <div class="drop-hint" id="dropHint">Drop an image here or click to upload</div>
                </div>
            </div>
            <div class="processing-overlay" id="processingOverlay">Processing…</div>
            <div class="canvas-info" id="canvasInfo"></div>
        </main>
        <aside class="right-panel" id="rightPanel">
            <div class="right-panel-inner" id="rightPanelInner"></div>
        </aside>
    </div>
    <script>
        (function() {
            const mainCanvas = document.getElementById('mainCanvas');
            const ctx = mainCanvas.getContext('2d');
            const canvasArea = document.getElementById('canvasArea');
            const emptyState = document.getElementById('emptyState');
            const processingOverlay = document.getElementById('processingOverlay');
            const canvasInfo = document.getElementById('canvasInfo');
            const rightPanelInner = document.getElementById('rightPanelInner');
            const fileInput = document.getElementById('fileInput');
            const dropHint = document.getElementById('dropHint');
            const btnUpload = document.getElementById('btnUpload');
            const btnCompare = document.getElementById('btnCompare');
            const btnReset = document.getElementById('btnReset');
            const btnExportPNG = document.getElementById('btnExportPNG');
            const btnExportJPEG = document.getElementById('btnExportJPEG');
            const sidebarButtons = document.querySelectorAll('.left-sidebar button[data-category]');

            // ── state ──
            const state = {
                originalImage: null,
                imageFilename: '',
                imageMetadata: { width: 0, height: 0, type: '', size: 0 },
                activeCategory: 'basic',
                isProcessing: false,
                compareMode: false,
                cropAspect: 'original',
                rotation: 0,
                flipH: false,
                flipV: false,
                exposure: 0,
                brightness: 0,
                contrast: 0,
                highlights: 0,
                shadows: 0,
                whites: 0,
                blacks: 0,
                saturation: 0,
                vibrance: 0,
                temperature: 0,
                tint: 0,
                sharpen: 0,
                clarity: 0,
                grainAmount: 0,
                grainSize: 1,
                vignette: 0,
                fade: 0,
                borderThickness: 0,
                borderColor: 'white',
                asciiEnabled: false, ditherEnabled: false, halftoneEnabled: false, dotsEnabled: false, pixelSortEnabled: false, vhsEnabled: false, photocopierEnabled: false, grungeEnabled: false,
                ascii: { charDensity: 60, charSize: 8, invert: false, monochrome: true, charSet: 'standard', fgColor: '#000000', bgColor: '#ffffff' },
                dither: { method: 'ordered', threshold: 128, levels: 2, pixelSize: 2, monochrome: true, invert: false },
                halftone: { dotSize: 5, spacing: 8, angle: 45, contrast: 50, monochrome: true, shape: 'round', misregistration: 0 },
                dots: { dotSize: 4, spacing: 10, density: 50, monochrome: true, jitter: 3, roundness: 80 },
                pixelSort: { direction: 'horizontal', threshold: 80, amount: 100, basis: 'luminance', randomness: 15, blendAmount: 100 },
                vhs: { scanlines: true, noise: 30, rgbShift: 4, wobble: 2, blur: 1, colourBleed: 20, timestamp: false, trackingLines: 15, saturationDecay: 25 },
                photocopier: { bwThreshold:128, tonerDensity:60, contrastCrush:40, blownHighlights:25, dirtyShadows:30, paperGrey:15, tonerSpeckles:20, dust:10, verticalStreaks:15, copyMisalignment:5, doubleCopyGhost:10, edgeBurn:20, scannerShadow:8, paperCrease:5, overcopiedDegradation:15 },
                grunge: { dust:15, scratches:12, stains:10, paperGrain:25, tornEdge:8, inkBleed:10, smudge:8, fadedPrint:15, wallTexture:12, posterPaste:10, roughBorder:18, printMisregistration:6, randomDistress:10 },
                activeFilmPreset: null,
                filmIntensity: 100, filmGrain: 0, filmFade: 0, filmHalation: 0, filmBloom: 0, filmVignette: 0, filmWarmth: 0, filmShadowLift: 0, filmHighlightSoftness: 0,
                exportFormat: 'png', jpegQuality: 90, exportIncludeBorder: true,
            };

            const filmPresets = [
                { name:'Kodak Portra 160', type:'colour', settings:{
                    exposure:4, contrast:-15, saturation:-12, highlights:-22, shadows:12,
                    shadowBias:[14,5,-10], midBias:[10,3,-12], highlightBias:[4,1,-10],
                    shadowLift:18, grainAmount:6, grainSize:0.6, fade:6, vignette:2, halation:0
                }},
                { name:'Kodak Portra 400', type:'colour', settings:{
                    exposure:3, contrast:-10, saturation:-8, highlights:-18, shadows:10,
                    shadowBias:[16,6,-8], midBias:[12,4,-10], highlightBias:[5,2,-12],
                    shadowLift:14, grainAmount:14, grainSize:1.0, fade:7, vignette:3, halation:5
                }},
                { name:'Kodak Portra 800', type:'colour', settings:{
                    exposure:0, contrast:-6, saturation:-6, highlights:-14, shadows:8,
                    shadowBias:[18,7,-5], midBias:[14,5,-8], highlightBias:[8,3,-14],
                    shadowLift:10, grainAmount:26, grainSize:1.5, fade:8, vignette:4, halation:12
                }},
                { name:'Kodak Gold 200', type:'colour', settings:{
                    exposure:5, contrast:-5, saturation:8, highlights:-10, shadows:6,
                    shadowBias:[18,10,-12], midBias:[14,6,-16], highlightBias:[6,2,-15],
                    shadowLift:10, grainAmount:12, grainSize:0.9, fade:6, vignette:3, halation:8
                }},
                { name:'Kodak Ultramax 400', type:'colour', settings:{
                    exposure:3, contrast:8, saturation:14, highlights:-6, shadows:6,
                    shadowBias:[8,3,-5], midBias:[8,2,-6], highlightBias:[3,0,-5],
                    shadowLift:6, grainAmount:16, grainSize:1.0, fade:3, vignette:2, halation:6
                }},
                { name:'Kodak Ektar 100', type:'colour', settings:{
                    exposure:2, contrast:12, saturation:25, highlights:-6, shadows:3,
                    shadowBias:[5,-5,-8], midBias:[12,-3,-12], highlightBias:[3,-2,-8],
                    shadowLift:2, grainAmount:4, grainSize:0.5, fade:1, vignette:1, halation:0
                }},
                { name:'Lomography Color 400', type:'colour', settings:{
                    exposure:-2, contrast:15, saturation:15, highlights:-18, shadows:15,
                    shadowBias:[-8,-12,22], midBias:[8,-4,12], highlightBias:[16,8,-8],
                    shadowLift:20, grainAmount:22, grainSize:1.4, fade:9, vignette:5, halation:14
                }},
                { name:'Lomography Color 800', type:'colour', settings:{
                    exposure:-3, contrast:22, saturation:10, highlights:-22, shadows:22,
                    shadowBias:[-12,-18,30], midBias:[12,-8,18], highlightBias:[22,10,-12],
                    shadowLift:25, grainAmount:32, grainSize:1.8, fade:12, vignette:6,
                    halation:20, halationColor:[1.0,0.5,0.1]
                }},
                { name:'Fujicolor C200', type:'colour', settings:{
                    exposure:2, contrast:-4, saturation:-6, highlights:-10, shadows:6,
                    shadowBias:[-5,4,10], midBias:[-4,5,8], highlightBias:[-2,2,4],
                    shadowLift:6, grainAmount:10, grainSize:0.8, fade:3, vignette:2, halation:0
                }},
                { name:'CineStill 800T', type:'colour', settings:{
                    exposure:-1, contrast:6, saturation:-5, highlights:-16, shadows:12,
                    shadowBias:[-18,-8,35], midBias:[-12,-5,25], highlightBias:[16,4,-12],
                    shadowLift:12, grainAmount:28, grainSize:1.6, fade:6, vignette:5,
                    halation:40, halationColor:[1.0,0.3,0.0]
                }},
                { name:'Kodak Tri-X 400', type:'bw', settings:{
                    exposure:0, contrast:20, saturation:-100, highlights:-10, shadows:10,
                    shadowBias:[0,0,0], midBias:[0,0,0], highlightBias:[0,0,0],
                    shadowLift:5, grainAmount:26, grainSize:1.4, fade:2, vignette:4, halation:0
                }},
                { name:'Ilford HP5 Plus 400', type:'bw', settings:{
                    exposure:0, contrast:12, saturation:-100, highlights:-8, shadows:8,
                    shadowBias:[0,0,0], midBias:[0,0,0], highlightBias:[0,0,0],
                    shadowLift:8, grainAmount:18, grainSize:1.1, fade:4, vignette:3, halation:0
                }},
                { name:'Ilford FP4 Plus 125', type:'bw', settings:{
                    exposure:2, contrast:10, saturation:-100, highlights:-5, shadows:5,
                    shadowBias:[0,0,0], midBias:[0,0,0], highlightBias:[0,0,0],
                    shadowLift:3, grainAmount:5, grainSize:0.5, fade:1, vignette:1, halation:0
                }},
                { name:'Kodak T-Max 400', type:'bw', settings:{
                    exposure:0, contrast:14, saturation:-100, highlights:-4, shadows:4,
                    shadowBias:[0,0,0], midBias:[0,0,0], highlightBias:[0,0,0],
                    shadowLift:2, grainAmount:8, grainSize:0.6, fade:0, vignette:1, halation:0
                }},
            ];

            // ── offscreen canvases ──
            const offscreenCanvas = document.createElement('canvas');
            const offscreenCtx = offscreenCanvas.getContext('2d');
            const grainCanvas = document.createElement('canvas');
            const grainCtx = grainCanvas.getContext('2d');
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
            function debounce(fn, ms) { let timer; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); }; }
            function showProcessing() { state.isProcessing = true; processingOverlay.classList.add('visible'); }
            function hideProcessing() { state.isProcessing = false; processingOverlay.classList.remove('visible'); }

            function getScaledDimensions(imgW, imgH, maxDim = 1400) {
                const maxW = Math.min(maxDim, canvasArea.clientWidth - 40);
                const maxH = Math.min(maxDim, canvasArea.clientHeight - 40);
                let w = imgW, h = imgH;
                if (w > maxW || h > maxH) {
                    const s = Math.min(maxW/w, maxH/h);
                    w = Math.round(w*s); h = Math.round(h*s);
                }
                return { w, h };
            }

            // ── grain texture ──
            function createGrainTexture(w, h, amount, grainSize) {
                grainCanvas.width = w; grainCanvas.height = h;
                const gctx = grainCtx;
                const imgData = gctx.createImageData(w, h);
                const data = imgData.data;
                const gs = Math.max(1, Math.round(grainSize));
                for (let y = 0; y < h; y += gs) {
                    for (let x = 0; x < w; x += gs) {
                        const noise = (Math.random() - 0.5) * 2 * amount;
                        const val = clamp(Math.round(128 + noise), 0, 255);
                        for (let dy = 0; dy < gs && y+dy < h; dy++) {
                            for (let dx = 0; dx < gs && x+dx < w; dx++) {
                                const idx = ((y+dy)*w + (x+dx)) * 4;
                                data[idx] = data[idx+1] = data[idx+2] = val;
                                data[idx+3] = Math.round(amount * 2.55);
                            }
                        }
                    }
                }
                gctx.putImageData(imgData, 0, 0);
            }

            function getWorkingDimensions() {
                if (!state.originalImage) return { w:0, h:0 };
                const oW = state.originalImage.width, oH = state.originalImage.height;
                let w = oW, h = oH;
                const ratios = { original: oW/oH, '1:1':1, '4:5':4/5, '3:2':3/2, '4:3':4/3, '16:9':16/9 };
                const target = ratios[state.cropAspect] || oW/oH;
                if (state.cropAspect !== 'original') {
                    if (oW/oH > target) { w = Math.round(oH*target); h = oH; }
                    else { w = oW; h = Math.round(oW/target); }
                }
                if (state.rotation % 180 !== 0) { let t = w; w = h; h = t; }
                return { w, h };
            }

            // ── complete effect implementations ──
            function applyBasicAdjustments(octx, w, h) {
                const exp = Math.pow(2, state.exposure/100*2);
                const bright = state.brightness/100*50;
                const cont = 1 + state.contrast/100;
                const sat = 1 + state.saturation/100;
                const vib = 1 + state.vibrance/100;
                const temp = state.temperature/100*30;
                const tint = state.tint/100*20;
                const hl = state.highlights/100;
                const sh = state.shadows/100;
                const wh = state.whites/100*30;
                const bl = state.blacks/100*30;
                const fade = state.fade/100;
                const clarity = state.clarity/100*30;
                const imgData = octx.getImageData(0,0,w,h);
                const d = imgData.data;
                for (let i=0; i<d.length; i+=4) {

            function applyFilmPreset(octx, w, h) {
                if (!state.activeFilmPreset) return;

                if (!preset) return;

                const I = state.filmIntensity / 100;

                // ── colour grading ──
                const imgData = octx.getImageData(0, 0, w, h);
                const d = imgData.data;
                const exp    = Math.pow(2, (s.exposure||0) / 100 * 2.5 * I);
                const cont   = 1 + (s.contrast||0) / 100 * I;
                const satMul = 1 + (s.saturation||0) / 100 * I;
                const hl     = (s.highlights||0) / 100 * I;
                const sh     = (s.shadows||0) / 100 * I;
                const fade   = ((s.fade||0) / 100 + state.filmFade / 100 * 0.5) * I;
                const sLift  = (s.shadowLift||0) * I;
                const sBias  = (s.shadowBias||[0,0,0]).map(v => v * I);

                const hBias  = (s.highlightBias||[0,0,0]).map(v => v * I);

                for (let i = 0; i < d.length; i += 4) {

                        g = clamp(g + sLift*Math.max(0,1-g/90),0,255);
                        b = clamp(b + sLift*Math.max(0,1-b/90),0,255);

                    const lumN = (0.299*r + 0.587*g + 0.114*b) / 255;
                    const sW = Math.pow(Math.max(0, 1 - lumN/0.45), 2);
                    const hW = Math.pow(Math.max(0, (lumN-0.55)/0.45), 2);
                    const mW = Math.max(0, 1 - sW - hW);
                    r = clamp(r + sBias[0]*sW + mBias[0]*mW + hBias[0]*hW,0,255);

                    b = clamp(b + sBias[2]*sW + mBias[2]*mW + hBias[2]*hW,0,255);

                // ── halation (glow around highlights) ──
                const halAmt = ((s.halation||0)/100 + state.filmHalation/200) * I;
                if (halAmt > 0.01) {
                    const hc = s.halationColor || [1.0, 0.4, 0.1];

                    const srcD = octx.getImageData(0,0,w,h).data;
                    const hlCv = document.createElement('canvas'); hlCv.width=w; hlCv.height=h;
                    const hlCx = hlCv.getContext('2d');

            }

            function applyAsciiEffect(octx, w, h) {

                const ch = Math.max(3, Math.round(a.charSize*1.6));

                if (cols<2||rows<2) return;

                const src = imgData.data;
                tempCanvas.width = w; tempCanvas.height = h;
                const tctx = tempCtx;
                tctx.fillStyle = a.bgColor; tctx.fillRect(0,0,w,h);

                octx.clearRect(0,0,w,h); octx.drawImage(tempCanvas,0,0);
            }

            function applyDitherEffect(octx, w, h) {
                const d = state.dither;
                const imgData = octx.getImageData(0,0,w,h);
                const data = imgData.data;
                const px = Math.max(1, Math.round(d.pixelSize));
                const bayer4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

                            let lum = 0.299*data[idx] + 0.587*data[idx+1] + 0.114*data[idx+2];
                            if (d.invert) lum = 255-lum;

                                }
                            }

            }

            function applyHalftoneEffect(octx, w, h) {
                const ht = state.halftone;
                const imgData = octx.getImageData(0,0,w,h);
                const src = imgData.data;
                const sp = Math.max(2, ht.spacing);
                const base = ht.dotSize/10;
                const cont = ht.contrast/100;
                tempCanvas.width = w; tempCanvas.height = h;
                const tctx = tempCtx; tctx.fillStyle='#fff'; tctx.fillRect(0,0,w,h);
                for (let y=0; y<h; y+=sp) {
                    for (let x=0; x<w; x+=sp) {
                        const sx = clamp(Math.round(x),0,w-1), sy = clamp(Math.round(y),0,h-1);
                        const idx = (sy*w+sx)*4;

            }

            function applyDotsEffect(octx, w, h) {
                const dt = state.dots;
                const imgData = octx.getImageData(0,0,w,h);
                const src = imgData.data;
                const sp = Math.max(3, dt.spacing);
                const base = dt.dotSize/10;
                tempCanvas.width = w; tempCanvas.height = h;
                const tctx = tempCtx; tctx.fillStyle='#fff'; tctx.fillRect(0,0,w,h);

                    for (let x=0; x<w; x+=sp) {

                        const jx = (Math.random()-0.5)*dt.jitter*2, jy = (Math.random()-0.5)*dt.jitter*2;
                        const sx = clamp(Math.round(x+jx),0,w-1), sy = clamp(Math.round(y+jy),0,h-1);
                        const idx = (sy*w+sx)*4;
