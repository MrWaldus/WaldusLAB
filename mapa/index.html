<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WaldusLab – FotoMapa Bogotá</title>
    <link rel="manifest" href="/mapa/manifest.json" />
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --panel-bg: #1a1a1a;
            --border: #ffffff;
            --text: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            height: 100%;
            font-family: 'Space Mono', monospace;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        .header {
            background: #000;
            border-bottom: 3px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
            position: relative;
            flex-wrap: wrap;
        }
        .brand {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }
        .brand .waldus {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 2px solid var(--border);
            padding: 2px 8px;
        }
        .brand .sub {
            font-size: 1rem;
            color: #ccc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-brutal {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            text-decoration: none;
        }
        .btn-brutal:hover { background: var(--border); color: #000; font-weight: bold; }
        .btn-brutal.active { background: var(--border); color: #000; font-weight: bold; }

        #status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .connected { background: #0f0; }
        .disconnected { background: #f00; }

        .map-container {
            position: absolute;
            top: 72px; bottom: 0; left: 0; right: 0;
            border-top: 2px solid var(--border);
        }
        #map { width: 100%; height: 100%; background: #000; }
        .leaflet-tile {
            filter: grayscale(100%) brightness(0.9) contrast(1.2);
        }

        .side-panel {
            position: absolute;
            top: 92px; right: 20px;
            width: 380px;
            max-height: calc(100vh - 130px);
            background: var(--panel-bg);
            border: 2px solid var(--border);
            padding: 15px;
            overflow-y: auto;
            z-index: 1000;
            font-size: 0.85rem;
            box-shadow: 8px 8px 0 rgba(255,255,255,0.1);
        }
        .panel-tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 15px;
            gap: 5px;
        }
        .panel-tab {
            background: transparent;
            border: 2px solid transparent;
            color: #aaa;
            padding: 6px 12px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-bottom: -2px;
        }
        .panel-tab.active { border: 2px solid var(--border); border-bottom-color: var(--panel-bg); color: var(--text); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 0.75rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: #000;
            border: 2px solid #444;
            color: #fff;
            padding: 6px;
            font-family: inherit;
            font-size: 0.8rem;
        }
        .form-row { display: flex; gap: 8px; }
        .form-row > * { flex: 1; }

        .list-item {
            border: 1px solid #333;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
            font-size: 0.8rem;
        }
        .list-item .remove { cursor: pointer; color: #aaa; font-weight: bold; }
        .list-item .remove:hover { color: #fff; }
        .route-point { display: flex; align-items: center; gap: 8px; }

        .spot-card {
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 8px;
            background: #111;
            font-size: 0.8rem;
        }
        .spot-card strong { font-size: 0.9rem; }
        .spot-actions { margin-top: 6px; display: flex; gap: 5px; }
        .spot-actions button { font-size: 0.65rem; padding: 3px 8px; }

        .leaflet-popup-content-wrapper {
            background: #000 !important;
            color: #fff !important;
            border: 2px solid #fff !important;
            border-radius: 0 !important;
            box-shadow: 8px 8px 0 rgba(255,255,255,0.15) !important;
            font-family: 'Space Mono', monospace !important;
        }
        .leaflet-popup-tip { background: #000 !important; border: 2px solid #fff !important; }
        .mr-waldus-badge { background: #fff; color: #000; padding: 1px 5px; font-weight: bold; font-size: 0.65rem; margin-left: 4px; }

        @media (max-width: 600px) {
            .side-panel {
                width: 300px;
                right: 10px;
                top: 80px;
                max-height: calc(100vh - 110px);
                font-size: 0.75rem;
            }
            .brand .sub { display: none; }
            .btn-brutal { padding: 6px 10px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">
            <span class="waldus">WaldusLab</span>
            <span class="sub">FotoMapa Bogotá</span>
        </div>
        <div class="header-actions">
            <span id="status-indicator" class="disconnected" title="Conectando..."></span>
            <button class="btn-brutal" id="exportBtn" title="Exportar spots">📤 JSON</button>
            <a href="/" class="btn-brutal">🏠 Home</a>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>
    </div>

    <div class="side-panel" id="sidePanel">
        <div class="panel-tabs">
            <button class="panel-tab active" data-tab="waldus">⭐ Waldus</button>
            <button class="panel-tab" data-tab="add">＋ Añadir</button>
            <button class="panel-tab" data-tab="ruta">🧭 Ruta</button>
            <button class="panel-tab" data-tab="library">📚 Bib.</button>
        </div>

        <div class="tab-content active" id="tab-waldus">
            <p style="margin-bottom:10px;"><strong>Mr Waldus recomienda:</strong></p>
            <div id="waldus-list"></div>
            <p style="font-size:0.7rem; margin-top:8px; color:#aaa;">Haz clic para ver en el mapa</p>
        </div>

        <div class="tab-content" id="tab-add">
            <p><strong>Ficha de registro</strong></p>
            <div class="form-group"><label>Nombre *</label><input type="text" id="fNombre" placeholder="Ej: Mirador La Calera"></div>
            <div class="form-row">
                <div class="form-group"><label>País</label><input type="text" id="fPais" value="Colombia"></div>
                <div class="form-group"><label>Ciudad</label><input type="text" id="fCiudad" value="Bogotá"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Categoría</label><select id="fCategoria"><option value="naturaleza">Naturaleza</option><option value="arquitectura">Arquitectura</option><option value="urbana">Urbana / Street</option><option value="astrofotografia">Astrofotografía</option></select></div>
                <div class="form-group"><label>Recomendado</label><input type="text" id="fRecomendado" placeholder="Mr Waldus, comunidad..."></div>
            </div>
            <div class="form-group">
                <label>Coordenadas * <button class="btn-brutal" id="pickCoordsBtn" style="font-size:0.7rem; padding:4px 8px;">📍 Elegir en mapa</button></label>
                <div class="form-row">
                    <input type="text" id="fLat" placeholder="Latitud"><input type="text" id="fLng" placeholder="Longitud">
                </div>
            </div>
            <div class="form-group"><label>Descripción</label><textarea id="fDesc" rows="2" placeholder="¿Por qué es un buen spot?"></textarea></div>
            <div class="form-group"><label>Mejor hora</label><input type="text" id="fHora" placeholder="Amanecer, atardecer..."></div>
            <div class="form-row">
                <div class="form-group"><label>Dificultad</label><input type="text" id="fDificultad" placeholder="Fácil, media..."></div>
                <div class="form-group"><label>Equipo</label><input type="text" id="fEquipo" placeholder="Gran angular, trípode..."></div>
            </div>
            <div class="form-group"><label>Permisos / Costos</label><input type="text" id="fPermisos" placeholder="Gratis, dron prohibido..."></div>
            <div class="form-group"><label>Seguridad</label><input type="text" id="fSeguridad" placeholder="Seguro de día, precaución..."></div>
            <div class="form-group"><label>Tags (separados por coma)</label><input type="text" id="fTags" placeholder="minimalismo, reflejos"></div>
            <div class="form-group"><label>Estado</label><select id="fEstado"><option value="verificado">Verificado</option><option value="reportado">Reportado</option><option value="temporalmente cerrado">Temporalmente cerrado</option></select></div>
            <input type="hidden" id="fId">
            <button class="btn-brutal" id="saveSpot" style="width:100%;">Guardar spot</button>
            <button class="btn-brutal" id="cancelEdit" style="width:100%; margin-top:5px; display:none;">Cancelar edición</button>
            <p id="addMessage" style="margin-top:8px; font-size:0.8rem;"></p>
        </div>

        <div class="tab-content" id="tab-ruta">
            <p><strong>Planificador de ruta</strong> <span id="routeStatus" style="font-size:0.7rem; color:#aaa;"></span></p>
            <button class="btn-brutal" id="toggleRouteMode" style="width:100%; margin-bottom:8px;">🧭 Activar modo ruta</button>
            <ul id="routeList" style="list-style:none; padding:0; margin:10px 0;"></ul>
            <button class="btn-brutal" id="clearRoute" style="width:100%;">Limpiar ruta</button>
        </div>

        <div class="tab-content" id="tab-library">
            <div style="margin-bottom:10px; display:flex; gap:5px;">
                <input type="text" id="searchLibrary" placeholder="Filtrar..." style="flex:1; background:#000; border:2px solid #444; color:#fff; padding:5px;">
                <button class="btn-brutal" id="clearFilter" style="font-size:0.7rem;">✕</button>
            </div>
            <div id="libraryList"></div>
            <p style="font-size:0.7rem; margin-top:10px;">Total: <span id="spotCount">0</span> spots</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ==================== CONFIGURACIÓN SUPABASE ====================
        const SUPABASE_URL = 'https://ynsduvfzhvpigjixwjsv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inluc2R1dmZ6aHZwaWdqaXh3anN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3ODY4MjksImV4cCI6MjA5NzM2MjgyOX0.ath8rGNWLMRZl-MTZlIhyHn_bBF8ZNpPcNKZz0_pIrQ';
        // Cambiamos el nombre de la variable para no colisionar con la global 'supabase'
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ==================== ESTADO ====================
        let spots = [];
        const statusDot = document.getElementById('status-indicator');

        // ==================== MAPA ====================
        const map = L.map('map').setView([4.635, -74.08], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        const markerGroup = L.layerGroup().addTo(map);
        const markersArray = [];

        function createIcon(recomendado = false) {
            const star = recomendado ? '★' : '';
            return L.divIcon({
                className: 'custom-marker',
                html: `<div style="width:20px;height:20px;background:#fff;border:2px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;font-weight:bold;box-shadow:0 0 8px rgba(0,0,0,0.8);">${star}</div>`,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
        }

        function renderMarkers() {
            markerGroup.clearLayers();
            markersArray.length = 0;
            spots.forEach(s => {
                const isWaldus = s.recomendado_por && s.recomendado_por.toLowerCase() === 'mr waldus';
                const marker = L.marker([s.lat, s.lng], { icon: createIcon(isWaldus) });
                marker.spot = s;
                marker.bindPopup(crearPopup(s));
                marker.on('click', handleMarkerClick);
                marker.addTo(markerGroup);
                markersArray.push(marker);
            });
        }

        function crearPopup(s) {
            const badge = (s.recomendado_por && s.recomendado_por.toLowerCase() === 'mr waldus')
                ? '<span class="mr-waldus-badge">Mr Waldus ★</span>' : '';
            return `
                <div style="font-weight:bold;font-size:1rem;text-transform:uppercase;">${s.nombre} ${badge}</div>
                <div style="display:inline-block;border:1px solid #fff;padding:2px 8px;font-size:0.65rem;margin:4px 0;">${s.categoria.toUpperCase()}</div>
                <div style="margin:4px 0;"><strong>🕒 Mejor hora:</strong> ${s.mejor_hora || '—'}</div>
                <div style="margin:4px 0;"><strong>⚡ Dificultad:</strong> ${s.dificultad || '—'}</div>
                <div style="margin:4px 0;"><strong>🎒 Equipo:</strong> ${s.equipo || '—'}</div>
                <div style="margin:4px 0;"><strong>🔐 Permisos:</strong> ${s.permisos || '—'}</div>
                <div style="margin:4px 0;"><strong>🛡️ Seguridad:</strong> ${s.seguridad || '—'}</div>
                <div style="margin-top:6px;">${s.descripcion}</div>
            `;
        }

        // ==================== RUTA ====================
        let routeMode = false;
        let routePoints = [];
        const routeLayer = L.layerGroup().addTo(map);

        function updateRouteDisplay() {
            routeLayer.clearLayers();
            if (routePoints.length >= 2) {
                L.polyline(routePoints.map(p => [p.lat, p.lng]), {
                    color: '#fff', weight: 4, dashArray: '10, 10', opacity: 0.9
                }).addTo(routeLayer);
            }
            const routeListEl = document.getElementById('routeList');
            routeListEl.innerHTML = routePoints.map((p, i) => `
                <li class="list-item">
                    <div class="route-point"><span>${i+1}.</span> ${p.nombre}</div>
                    <span class="remove" data-index="${i}">✕</span>
                </li>
            `).join('');
            document.querySelectorAll('#routeList .remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    routePoints.splice(idx, 1);
                    updateRouteDisplay();
                });
            });
        }

        function handleMarkerClick(e) {
            if (routeMode) {
                L.DomEvent.stopPropagation(e);
                const spot = e.target.spot;
                if (!routePoints.some(rp => rp.nombre === spot.nombre && rp.lat === spot.lat && rp.lng === spot.lng)) {
                    routePoints.push({ lat: spot.lat, lng: spot.lng, nombre: spot.nombre });
                    updateRouteDisplay();
                }
            }
        }

        document.getElementById('toggleRouteMode').addEventListener('click', function() {
            routeMode = !routeMode;
            this.classList.toggle('active', routeMode);
            this.textContent = routeMode ? '🧭 Modo ruta ACTIVO' : '🧭 Activar modo ruta';
            document.getElementById('routeStatus').textContent = routeMode ? '(clic en marcadores para añadir)' : '';
        });
        document.getElementById('clearRoute').addEventListener('click', () => {
            routePoints = [];
            updateRouteDisplay();
        });

        // ==================== FORMULARIO ====================
        const f = {
            id: document.getElementById('fId'),
            nombre: document.getElementById('fNombre'),
            pais: document.getElementById('fPais'),
            ciudad: document.getElementById('fCiudad'),
            categoria: document.getElementById('fCategoria'),
            recomendado: document.getElementById('fRecomendado'),
            lat: document.getElementById('fLat'),
            lng: document.getElementById('fLng'),
            desc: document.getElementById('fDesc'),
            hora: document.getElementById('fHora'),
            dificultad: document.getElementById('fDificultad'),
            equipo: document.getElementById('fEquipo'),
            permisos: document.getElementById('fPermisos'),
            seguridad: document.getElementById('fSeguridad'),
            tags: document.getElementById('fTags'),
            estado: document.getElementById('fEstado'),
            saveBtn: document.getElementById('saveSpot'),
            cancelBtn: document.getElementById('cancelEdit'),
            msg: document.getElementById('addMessage')
        };

        function limpiarFormulario() {
            f.id.value = '';
            f.nombre.value = '';
            f.pais.value = 'Colombia';
            f.ciudad.value = 'Bogotá';
            f.categoria.value = 'naturaleza';
            f.recomendado.value = '';
            f.lat.value = '';
            f.lng.value = '';
            f.desc.value = '';
            f.hora.value = '';
            f.dificultad.value = '';
            f.equipo.value = '';
            f.permisos.value = '';
            f.seguridad.value = '';
            f.tags.value = '';
            f.estado.value = 'verificado';
            f.msg.textContent = '';
            f.cancelBtn.style.display = 'none';
            f.saveBtn.textContent = 'Guardar spot';
        }

        function cargarSpotEnFormulario(spot) {
            f.id.value = spot.id;
            f.nombre.value = spot.nombre;
            f.pais.value = spot.pais || 'Colombia';
            f.ciudad.value = spot.ciudad || 'Bogotá';
            f.categoria.value = spot.categoria;
            f.recomendado.value = spot.recomendado_por || '';
            f.lat.value = spot.lat;
            f.lng.value = spot.lng;
            f.desc.value = spot.descripcion || '';
            f.hora.value = spot.mejor_hora || '';
            f.dificultad.value = spot.dificultad || '';
            f.equipo.value = spot.equipo || '';
            f.permisos.value = spot.permisos || '';
            f.seguridad.value = spot.seguridad || '';
            f.tags.value = spot.tags ? spot.tags.join(', ') : '';
            f.estado.value = spot.estado || 'verificado';
            f.cancelBtn.style.display = 'inline-block';
            f.saveBtn.textContent = 'Actualizar spot';
            document.querySelector('.panel-tab[data-tab="add"]').click();
        }

        f.saveBtn.addEventListener('click', async () => {
            const nombre = f.nombre.value.trim();
            const lat = parseFloat(f.lat.value);
            const lng = parseFloat(f.lng.value);
            if (!nombre || isNaN(lat) || isNaN(lng)) {
                f.msg.textContent = '❌ Nombre y coordenadas obligatorios.';
                f.msg.style.color = '#ff6666';
                return;
            }
            const tags = f.tags.value.split(',').map(t => t.trim()).filter(t => t);
            const spotData = {
                nombre,
                pais: f.pais.value.trim(),
                ciudad: f.ciudad.value.trim(),
                categoria: f.categoria.value,
                recomendado_por: f.recomendado.value.trim(),
                lat,
                lng,
                descripcion: f.desc.value.trim(),
                mejor_hora: f.hora.value.trim(),
                dificultad: f.dificultad.value.trim(),
                equipo: f.equipo.value.trim(),
                permisos: f.permisos.value.trim(),
                seguridad: f.seguridad.value.trim(),
                tags,
                estado: f.estado.value
            };

            let error = null;
            if (f.id.value) {
                const { error: updateError } = await supabaseClient
                    .from('spots')
                    .update(spotData)
                    .eq('id', parseInt(f.id.value));
                error = updateError;
            } else {
                const { error: insertError } = await supabaseClient
                    .from('spots')
                    .insert([spotData]);
                error = insertError;
            }

            if (error) {
                f.msg.textContent = '❌ Error: ' + error.message;
                f.msg.style.color = '#ff6666';
                return;
            }
            await cargarSpots();
            limpiarFormulario();
            f.msg.textContent = '✅ Spot guardado.';
            f.msg.style.color = '#fff';
        });

        f.cancelBtn.addEventListener('click', limpiarFormulario);

        let pickingCoords = false;
        document.getElementById('pickCoordsBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            pickingCoords = true;
            e.target.textContent = '📍 Clic en el mapa...';
            map.getContainer().style.cursor = 'crosshair';
        });
        map.on('click', function(e) {
            if (pickingCoords) {
                f.lat.value = e.latlng.lat.toFixed(6);
                f.lng.value = e.latlng.lng.toFixed(6);
                pickingCoords = false;
                document.getElementById('pickCoordsBtn').textContent = '📍 Elegir en mapa';
                map.getContainer().style.cursor = '';
            }
        });

        // ==================== CARGA DE DATOS ====================
        async function cargarSpots() {
            statusDot.className = 'disconnected';
            const { data, error } = await supabaseClient
                .from('spots')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error cargando spots:', error);
                statusDot.className = 'disconnected';
                document.getElementById('libraryList').innerHTML = `<p style="color:#ff6666;">⚠️ Error al conectar con Supabase: ${error.message}</p>`;
                return;
            }

            spots = data || [];
            statusDot.className = 'connected';
            statusDot.title = 'Conectado · ' + spots.length + ' spots';
            renderMarkers();
            renderWaldusList();
            renderBiblioteca();
        }

        // ==================== BIBLIOTECA ====================
        function renderBiblioteca(filtro = '') {
            const container = document.getElementById('libraryList');
            const filtrados = filtro
                ? spots.filter(s => s.nombre.toLowerCase().includes(filtro.toLowerCase()))
                : spots;
            container.innerHTML = filtrados.map(s => `
                <div class="spot-card">
                    <strong>${s.nombre}</strong> <span style="font-size:0.7rem;">[${s.categoria}]</span>
                    <div>📍 ${s.lat.toFixed(4)}, ${s.lng.toFixed(4)} | ${s.ciudad}, ${s.pais}</div>
                    <div>${s.descripcion ? s.descripcion.substring(0,60)+'…' : ''}</div>
                    <div class="spot-actions">
                        <button class="btn-brutal editar-btn" data-id="${s.id}">✏️ Editar</button>
                        <button class="btn-brutal eliminar-btn" data-id="${s.id}">🗑️ Eliminar</button>
                    </div>
                </div>
            `).join('') || '<p style="color:#aaa;">No hay spots registrados.</p>';
            document.getElementById('spotCount').textContent = spots.length;

            document.querySelectorAll('.editar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const spot = spots.find(s => s.id == btn.dataset.id);
                    if (spot) cargarSpotEnFormulario(spot);
                });
            });
            document.querySelectorAll('.eliminar-btn').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('¿Eliminar este spot?')) {
                        const { error } = await supabaseClient
                            .from('spots')
                            .delete()
                            .eq('id', parseInt(btn.dataset.id));
                        if (!error) {
                            await cargarSpots();
                        } else {
                            alert('Error al eliminar: ' + error.message);
                        }
                    }
                });
            });
        }

        document.getElementById('searchLibrary').addEventListener('input', function() {
            renderBiblioteca(this.value);
        });
        document.getElementById('clearFilter').addEventListener('click', () => {
            document.getElementById('searchLibrary').value = '';
            renderBiblioteca();
        });

        // ==================== WALDUS ====================
        function renderWaldusList() {
            const container = document.getElementById('waldus-list');
            const waldusSpots = spots.filter(s => s.recomendado_por && s.recomendado_por.toLowerCase() === 'mr waldus');
            container.innerHTML = waldusSpots.map(s => `
                <div class="list-item" style="flex-direction:column; align-items:flex-start;">
                    <strong>★ ${s.nombre}</strong>
                    <span style="font-size:0.7rem;">${s.descripcion ? s.descripcion.substring(0,70)+'…' : ''}</span>
                    <button class="btn-brutal" style="font-size:0.65rem; margin-top:4px;"
                        onclick="centrarEn(${s.lat}, ${s.lng})">Ver en mapa</button>
                </div>
            `).join('') || '<p style="color:#aaa;">Aún no hay recomendaciones.</p>';
        }

        function centrarEn(lat, lng) {
            map.setView([lat, lng], 16);
            markersArray.forEach(m => {
                if (m.getLatLng().lat === lat && m.getLatLng().lng === lng) m.openPopup();
            });
        }

        // ==================== EXPORTAR ====================
        document.getElementById('exportBtn').addEventListener('click', () => {
            const dataStr = JSON.stringify(spots, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fotomapa_bogota_spots.json';
            a.click();
            URL.revokeObjectURL(url);
        });

        // ==================== PESTAÑAS ====================
        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
                if (tab.dataset.tab === 'library') renderBiblioteca();
                if (tab.dataset.tab === 'waldus') renderWaldusList();
            });
        });

        // ==================== INICIO ====================
        cargarSpots();

        // Registro del Service Worker (ruta absoluta)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/mapa/sw.js');
        }
    </script>
</body>
</html>
